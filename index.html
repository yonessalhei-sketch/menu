<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رستوران شاندیز | منوی دیجیتال</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap');
:root{--gold:#d4a24e;--gold2:#ffcf7a;--bg:#0f0c08}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Nastaliq Urdu',serif;background:var(--bg);color:#f5e9d0;line-height:2.2;overflow-x:hidden}
header{position:relative;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=w=1600')center/cover;padding:35px 15px}
.logo-box{width:125px;height:125px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#000;box-shadow:0 0 35px #d4a24e77;z-index:3;cursor:pointer;user-select:none}
.logo-box img{width:100%;height:100%;object-fit:cover}
header h1{font-size:50px;color:var(--gold2)}
header p{color:#e8d5a8}
.steam{position:absolute;bottom:0;display:flex;gap:16px;opacity:.5}
.steam span{width:18px;height:90px;background:linear-gradient(to top,transparent,rgba(255,255,255,.5),transparent);border-radius:50%;filter:blur(8px);animation:st 3.6s infinite}
.steam span:nth-child(2){animation-delay:.7s}.steam span:nth-child(3){animation-delay:1.3s}.steam span:nth-child(4){animation-delay:1.9s}.steam span:nth-child(5){animation-delay:2.5s}
@keyframes st{0%{transform:translateY(50px);opacity:0}50%{opacity:.9}100%{transform:translateY(-200px) scaleX(2);opacity:0}}
nav{position:sticky;top:0;z-index:50;background:#1a140de6;backdrop-filter:blur(10px);display:flex;justify-content:center;gap:10px;padding:13px;flex-wrap:wrap;border-bottom:1px solid #d4a24e44}
nav button{background:transparent;border:1px solid var(--gold);color:#ffdf9e;padding:7px 24px;border-radius:30px;font-family:inherit;font-size:16px;cursor:pointer;transition:.3s}
nav button.active,nav button:hover{background:var(--gold);color:#111}
.search-box{max-width:1000px;margin:16px auto 0;padding:0 20px}
.search-box input{width:100%;padding:11px 18px;border-radius:30px;border:1px solid #d4a24e55;background:#1c1710;color:#fff;font-family:inherit}
.slider-wrap{max-width:1000px;margin:18px auto;padding:0 20px}
.slider{position:relative;border-radius:20px;overflow:hidden;border:1px solid #d4a24e55;background:#1c160e;min-height:250px}
.slides{display:flex;transition:transform .8s ease}
.slide{min-width:100%;display:flex;gap:20px;align-items:center;padding:20px 26px}
.slide img{width:260px;height:190px;object-fit:cover;border-radius:14px;border:2px solid var(--gold)}
.slide h3{color:var(--gold2);font-size:26px}.slide .price{color:#8aff8a;font-size:20px}
.dots{text-align:center}.dots span{display:inline-block;width:10px;height:10px;background:#6b5a3a;border-radius:50%;margin:5px 3px}
.dots span.active{background:var(--gold);width:28px;border-radius:10px}
.container{max-width:1100px;margin:auto;padding:10px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}
.card{background:linear-gradient(180deg,#241c11,#14100a);border:1px solid #d4a24e33;border-radius:18px;overflow:hidden;transition:.35s;position:relative}
.card:hover{transform:translateY(-7px);border-color:var(--gold);box-shadow:0 12px 35px #000}
.card .img-wrap{height:185px;background:#000;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;background:var(--gold);color:#000;font-size:12px;padding:1px 12px;border-radius:20px}
.card-body{padding:13px 15px;text-align:center}
.card-body h3{color:#ffdf9e;font-size:21px}.card-body p{font-size:14px;color:#bfa87a}
.price-row{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #d4a24e55;margin-top:8px;padding-top:9px}
.price{color:#8aff8a;font-weight:bold}.order-btn{background:var(--gold);border:none;padding:6px 20px;border-radius:20px;font-family:inherit;cursor:pointer}
#adminBtn{position:fixed;bottom:18px;left:18px;background:#222;color:#777;border:1px solid #444;padding:9px 16px;border-radius:50px;font-family:inherit;font-size:13px;cursor:pointer;z-index:100;opacity:.7}
#adminBtn:hover{opacity:1;color:var(--gold2);border-color:var(--gold)}
#adminPanel,#loginModal{position:fixed;inset:0;background:#000000d9;display:none;justify-content:center;align-items:flex-start;z-index:200;padding:20px;overflow:auto}
.panel,.login-box{background:#1e1710;border:1px solid var(--gold);border-radius:18px;max-width:720px;width:100%;padding:24px;margin:auto}
.login-box{max-width:380px;text-align:center}
.panel h2,.login-box h2{color:var(--gold2);text-align:center}
.panel label{display:block;margin:10px 0 4px;color:#e8d5a8;font-size:14px}
.panel input,.panel select,.login-box input{width:100%;padding:10px;border-radius:10px;border:1px solid #d4a24e55;background:#0f0c08;color:#fff;font-family:inherit}
.panel button.act,.login-box button{margin-top:12px;padding:11px;border-radius:10px;border:none;font-family:inherit;width:100%;cursor:pointer}
.btn-add{background:#2e9e44;color:#fff}.btn-save{background:var(--gold);font-weight:bold}.btn-close{background:#a33;color:#fff}.btn-gray{background:#444;color:#fff}
.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tabs button{background:#0f0c08;border:1px solid var(--gold);color:#ffdf9e;padding:6px 16px;border-radius:20px;font-family:inherit;cursor:pointer}
.tabs button.active{background:var(--gold);color:#000}
.tab{display:none}.tab.active{display:block}
.list-item{background:#0f0c08;border:1px solid #d4a24e33;border-radius:10px;padding:7px 12px;margin:6px 0;display:flex;justify-content:space-between;font-size:14px;align-items:center}
.list-item button{background:none;border:1px solid #777;color:#ddd;border-radius:8px;padding:2px 10px;font-family:inherit;cursor:pointer;font-size:12px;margin-right:4px}
#codeOutput{background:#000;color:#7CFC00;padding:12px;border-radius:10px;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:10px}
.lock-note{background:#0f3d1e;border:1px solid #2e9e44;color:#9dffb0;border-radius:12px;padding:10px;font-size:13px;margin:10px 0;text-align:center}
@media(max-width:700px){.slide{flex-direction:column;text-align:center}.slide img{width:100%}header h1{font-size:34px}}
</style>
</head>
<body>

<header>
<div class="steam"><span></span><span></span><span></span><span></span><span></span></div>
<div class="logo-box" id="logoClick" title="3 بار کلیک برای ورود مدیر"><img id="siteLogo" src="https://via.placeholder.com/300x300?text=LOGO"></div>
<h1 id="resName">رستوران شاندیز</h1>
<p id="resSub">طعم اصیل ایرانی | منوی دیجیتال</p>
</header>

<nav id="catNav"></nav>
<div class="search-box"><input id="search" placeholder="جستجوی غذا..." oninput="render()"></div>

<div class="slider-wrap"><div class="slider"><div class="slides" id="slides"></div></div><div class="dots" id="dots"></div></div>

<div class="container"><div class="grid" id="menuGrid"></div></div>

<button id="adminBtn">⚙️ مدیریت</button>

<!-- مودال ورود -->
<div id="loginModal"><div class="login-box">
<h2>ورود مدیر 🔒</h2>
<p style="font-size:13px;color:#bfa87a">این بخش فقط برای صاحب رستوران است<br>رمز پیش‌فرض: 1234</p>
<input type="password" id="passInput" placeholder="رمز مدیریت" style="margin-top:10px;text-align:center">
<button class="btn-save" onclick="login()">ورود</button>
<button class="btn-gray" onclick="document.getElementById('loginModal').style.display='none'">انصراف (حالت مشتری)</button>
</div></div>

<!-- پنل -->
<div id="adminPanel"><div class="panel">
<h2>پنل مدیریت (حالت مالک) ✅</h2>
<div class="lock-note">🔒 مشتری این پنل را نمی‌بیند. برای تحویل به مشتری، فقط همین فایل را بدهید. بدون رمز هیچ تغییری نمی‌تواند بدهد.</div>
<div class="tabs">
<button class="active" onclick="showTab(0,this)">🍽️ افزودن</button>
<button onclick="showTab(1,this)">📋 ویرایش و حذف</button>
<button onclick="showTab(2,this)">🎨 اسم، لوگو، رمز</button>
<button onclick="showTab(3,this)">💻 کد</button>
</div>

<div class="tab active">
<label>اسم غذا:</label><input id="fName" placeholder="مثلا چلوکباب">
<label>قیمت:</label><input id="fPrice" placeholder="مثلا ۳۸۰٬۰۰۰ تومان">
<label>دسته:</label><select id="fCat"></select>
<label>توضیح:</label><input id="fDesc">
<label>عکس (آپلود):</label><input type="file" id="fImgFile" accept="image/*">
<label>یا لینک عکس:</label><input id="fImg" placeholder="https://...">
<label>برچسب ویژه:</label><input id="fBadge" placeholder="مثل ویژه / جدید (اختیاری)">
<label><input type="checkbox" id="fSlide" style="width:auto"> نمایش در اسلایدر</label>
<button class="act btn-add" onclick="addFood()">➕ اضافه کردن غذا</button>
</div>

<div class="tab">
<div id="editList"></div>
<div id="editForm" style="display:none;border:1px dashed var(--gold);border-radius:12px;padding:12px;margin-top:10px">
<label>اسم:</label><input id="eName"><label>قیمت:</label><input id="ePrice">
<label>دسته:</label><select id="eCat"></select><label>توضیح:</label><input id="eDesc">
<label>عکس جدید (لینک):</label><input id="eImg">
<button class="act btn-save" onclick="saveEdit()">💾 ذخیره ویرایش</button>
</div>
</div>

<div class="tab">
<label>نام رستوران:</label><input id="sName">
<label>زیرعنوان:</label><input id="sSub">
<button class="act btn-save" onclick="saveSite()">ثبت نام رستوران</button>
<hr style="margin:12px 0;border-color:#d4a24e44">
<label>لوگو (آپلود):</label><input type="file" id="logoUpload" accept="image/*">
<label>یا لینک لوگو:</label><input id="logoLink">
<button class="act btn-gray" onclick="changeLogo()">ثبت لوگو</button>
<hr style="margin:12px 0;border-color:#d4a24e44">
<label>تغییر رمز مدیریت:</label><input id="newPass" placeholder="رمز جدید را بنویسید">
<button class="act btn-save" onclick="changePass()">🔑 تغییر رمز</button>
<button class="act btn-gray" onclick="logout()">خروج از حالت مدیر (قفل برای مشتری)</button>
<button class="act btn-close" onclick="resetAll()">بازنشانی کامل</button>
</div>

<div class="tab">
<div id="codeOutput">هنوز غذایی اضافه نشده...</div>
<button class="act btn-gray" onclick="copyCode()">کپی کد</button>
</div>

<button class="act btn-close" onclick="closePanel()">بستن (قفل می‌ماند)</button>
</div></div>

<script>
let defaultCats={starter:'پیش‌غذا',main:'غذای اصلی',drink:'نوشیدنی',dessert:'دسر'};
let cats=JSON.parse(localStorage.getItem('cats3')||JSON.stringify(defaultCats));
let defaultMenu=[
{cat:'main',name:'چلوکباب سلطانی',price:'۳۸۰٬۰۰۰ تومان',desc:'برگ و کوبیده با برنج اعلا',img:'https://images.unsplash.com/photo-1544025162-d76694265947?q=w=600',badge:'ویژه سرآشپز',slide:true},
{cat:'starter',name:'سوپ جو مجلسی',price:'۱۲۰٬۰۰۰ تومان',desc:'سوپ داغ با جو و خامه',img:'https://images.unsplash.com/photo-1547592166-23ac45744acd?q=w=600',badge:'',slide:true},
{cat:'main',name:'قورمه‌سبزی',price:'۲۸۰٬۰۰۰ تومان',desc:'خورشت اصیل ایرانی',img:'https://images.unsplash.com/photo-1585937421612-70a008356fbe?q=w=600',badge:'',slide:false},
{cat:'drink',name:'دوغ محلی',price:'۴۰٬۰۰۰ تومان',desc:'دوغ سنتی',img:'https://images.unsplash.com/photo-1553530666-ba11a7da3888?q=w=600',badge:'',slide:false},
{cat:'dessert',name:'بستنی سنتی',price:'۹۰٬۰۰۰ تومان',desc:'زعفرانی با پسته',img:'https://images.unsplash.com/photo-1563805042-7684c019e1cb?q=w=600',badge:'جدید',slide:false}
];
let menu=JSON.parse(localStorage.getItem('myMenu3')||JSON.stringify(defaultMenu));
let isAdmin=false, activeCat='all', editIndex=-1, idx=0, clickCount=0;
if(localStorage.getItem('myLogo'))document.getElementById('siteLogo').src=localStorage.getItem('myLogo');
if(localStorage.getItem('resName'))document.getElementById('resName').textContent=localStorage.getItem('resName');
if(localStorage.getItem('resSub'))document.getElementById('resSub').textContent=localStorage.getItem('resSub');
function getPass(){return localStorage.getItem('adminPass')||'1234';}
function fillCats(){let s1=document.getElementById('fCat'),s2=document.getElementById('eCat');s1.innerHTML='';s2.innerHTML='';for(let k in cats){s1.innerHTML+=`<option value="${k}">${cats[k]}</option>`;s2.innerHTML+=`<option value="${k}">${cats[k]}</option>`;}let n=document.getElementById('catNav');n.innerHTML=`<button class="${activeCat==='all'?'active':''}" onclick="setCat('all',this)">همه</button>`;for(let k in cats){n.innerHTML+=`<button class="${activeCat===k?'active':''}" onclick="setCat('${k}',this)">${cats[k]}</button>`;}}
function setCat(c,el){activeCat=c;document.querySelectorAll('#catNav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function render(){fillCats();let grid=document.getElementById('menuGrid');grid.innerHTML='';let q=document.getElementById('search').value.trim();menu.forEach((m,i)=>{if(activeCat!=='all'&&m.cat!==activeCat)return;if(q&&!m.name.includes(q))return;let adminBtns=isAdmin?`<div style="display:flex;gap:6px;justify-content:center;margin-top:8px"><button onclick="openEdit(${i})" style="background:none;border:1px solid #666;color:#bbb;border-radius:12px;padding:1px 10px;font-family:inherit;font-size:12px;cursor:pointer">✏️ ویرایش</button><button onclick="delFood(${i})" style="background:none;border:1px solid #666;color:#bbb;border-radius:12px;padding:1px 10px;font-family:inherit;font-size:12px;cursor:pointer">🗑 حذف</button></div>`:'';let d=document.createElement('div');d.className='card';d.innerHTML=`${m.badge?`<div class="badge">${m.badge}</div>`:''}<div class="img-wrap"><img src="${m.img}" onerror="this.src='https://via.placeholder.com/400x300?text=Food'"></div><div class="card-body"><h3>${m.name}</h3><p>${m.desc}</p><div class="price-row"><span class="price">${m.price}</span><button class="order-btn" onclick="alert('سفارش ${m.name} ثبت شد!')">سفارش</button></div>${adminBtns}</div>`;grid.appendChild(d);});renderSlides();if(isAdmin)renderEditList();localStorage.setItem('myMenu3',JSON.stringify(menu));}
function renderSlides(){let s=document.getElementById('slides');s.innerHTML='';let items=menu.filter(x=>x.slide);if(!items.length)items=menu.slice(0,3);items.forEach(m=>{let d=document.createElement('div');d.className='slide';d.innerHTML=`<img src="${m.img}"><div><h3>${m.name}</h3><p>${m.desc}</p><div class="price">${m.price}</div></div>`;s.appendChild(d);});let dt=document.getElementById('dots');dt.innerHTML='';for(let i=0;i<s.children.length;i++){let sp=document.createElement('span');if(i===0)sp.className='active';sp.onclick=()=>go(i);dt.appendChild(sp);}go(0);}
function go(i){let s=document.getElementById('slides');if(!s.children.length)return;idx=i;if(idx>=s.children.length)idx=0;if(idx<0)idx=s.children.length-1;s.style.transform=`translateX(${idx*100}%)`;document.querySelectorAll('#dots span').forEach((x,j)=>x.classList.toggle('active',j===idx));}
setInterval(()=>go(idx+1),4500);
// ورود
document.getElementById('adminBtn').onclick=()=>{if(isAdmin)document.getElementById('adminPanel').style.display='flex';else document.getElementById('loginModal').style.display='flex';};
document.getElementById('logoClick').onclick=()=>{clickCount++;if(clickCount===3){clickCount=0;if(isAdmin)document.getElementById('adminPanel').style.display='flex';else document.getElementById('loginModal').style.display='flex';}setTimeout(()=>clickCount=0,1200);};
function login(){let v=document.getElementById('passInput').value;if(v===getPass()){isAdmin=true;document.getElementById('loginModal').style.display='none';document.getElementById('adminPanel').style.display='flex';render();alert('خوش آمدی مدیر ✅');}else alert('رمز اشتباه است ❌');}
function logout(){isAdmin=false;closePanel();render();alert('قفل شد 🔒 حالا حالت مشتری است');}
function changePass(){let v=document.getElementById('newPass').value.trim();if(v.length<4){alert('رمز حداقل ۴ کاراکتر باشد');return;}localStorage.setItem('adminPass',v);alert('رمز جدید ثبت شد: '+v);}
function closePanel(){document.getElementById('adminPanel').style.display='none';}
function showTab(n,btn){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));}
function addFood(){let name=document.getElementById('fName').value||'غذای جدید';let price=document.getElementById('fPrice').value||'--- تومان';let cat=document.getElementById('fCat').value;let desc=document.getElementById('fDesc').value||'توضیحات';let badge=document.getElementById('fBadge').value||'';let slide=document.getElementById('fSlide').checked;let link=document.getElementById('fImg').value;let file=document.getElementById('fImgFile').files[0];function save(img){menu.push({cat,name,price,desc,img,badge,slide});document.getElementById('codeOutput').textContent=`<div class="card" data-cat="${cat}">\n  <div class="img-wrap"><img src="${img}" alt="${name}"></div>\n  <div class="card-body"><h3>${name}</h3><p>${desc}</p>\n  <div class="price-row"><span class="price">${price}</span><button class="order-btn">سفارش</button></div></div>\n</div>`;render();alert('اضافه شد ✅');}if(file){let r=new FileReader();r.onload=e=>save(e.target.result);r.readAsDataURL(file);}else save(link||'https://via.placeholder.com/400x300?text='+encodeURIComponent(name));}
function renderEditList(){let l=document.getElementById('editList');if(!l)return;l.innerHTML='';menu.forEach((m,i)=>{l.innerHTML+=`<div class="list-item"><span>${m.name} | ${m.price}</span><span><button onclick="openEdit(${i})">ویرایش</button><button onclick="delFood(${i})">حذف</button><button onclick="toggleSlide(${i})">${m.slide?'⭐':'☆'}</button></span></div>`;});}
function openEdit(i){editIndex=i;document.getElementById('editForm').style.display='block';document.getElementById('eName').value=menu[i].name;document.getElementById('ePrice').value=menu[i].price;document.getElementById('eCat').value=menu[i].cat;document.getElementById('eDesc').value=menu[i].desc;}
function saveEdit(){menu[editIndex].name=document.getElementById('eName').value;menu[editIndex].price=document.getElementById('ePrice').value;menu[editIndex].cat=document.getElementById('eCat').value;menu[editIndex].desc=document.getElementById('eDesc').value;let ni=document.getElementById('eImg').value;if(ni)menu[editIndex].img=ni;document.getElementById('editForm').style.display='none';render();alert('ذخیره شد ✅');}
function delFood(i){if(confirm('حذف شود؟')){menu.splice(i,1);render();}}
function toggleSlide(i){menu[i].slide=!menu[i].slide;render();}
function saveSite(){let n=document.getElementById('sName').value,s=document.getElementById('sSub').value;if(n){document.getElementById('resName').textContent=n;localStorage.setItem('resName',n);}if(s){document.getElementById('resSub').textContent=s;localStorage.setItem('resSub',s);}alert('ثبت شد ✅');}
function changeLogo(){let link=document.getElementById('logoLink').value,f=document.getElementById('logoUpload').files[0];if(f){let r=new FileReader();r.onload=e=>{document.getElementById('siteLogo').src=e.target.result;localStorage.setItem('myLogo',e.target.result);alert('لوگو ثبت شد ✅');};r.readAsDataURL(f);}else if(link){document.getElementById('siteLogo').src=link;localStorage.setItem('myLogo',link);alert('ثبت شد ✅');}}
function copyCode(){navigator.clipboard.writeText(document.getElementById('codeOutput').textContent);alert('کپی شد ✅');}
function resetAll(){if(confirm('ریست کامل؟')){localStorage.clear();location.reload();}}
render();
</script>
</body>
</html>
